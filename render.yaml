services:
  - type: web
    name: printshop-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRINT_MODE
        value: simulate
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app
